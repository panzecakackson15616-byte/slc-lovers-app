# XcodeGen 配置文件
# 安装 XcodeGen: brew install xcodegen
# 使用方法: cd iOS && xcodegen
name: SLC-Lovers
options:
  bundleIdPrefix: com.slclovers
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  # 关键：让 XcodeGen 生成 Xcode 14 能识别的项目格式（objectVersion 56）
  # GitHub Actions runner 上的 Xcode 15.4 默认 Xcode 16 的 project format
  # Xcode 77 = Xcode 16, Xcode 56 = Xcode 14, Xcode 51 = Xcode 12+
  # 设置 56 兼容性最广
  xcodeVersion: "14.0"
  compatibilityVersion: "Xcode 14.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SLC-Lovers:
    type: application
    platform: iOS
    sources:
      - path: SLC-Lovers
        excludes:
          - "Info.plist"
    resources:
      - path: SLC-Lovers/Resources/Assets.xcassets
      - path: SLC-Lovers/Resources/Assets.xcassets/AppIcon.appiconset
    info:
      path: SLC-Lovers/Info.plist
      properties:
        CFBundleDisplayName: SLC-Lovers
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: Cream
        NSLocationWhenInUseUsageDescription: "SLC-Lovers 需要位置权限来显示你与 TA 的距离，让你们更近一点。"
        NSPhotoLibraryUsageDescription: "SLC-Lovers 需要相册权限来上传你们的共同回忆。"
        NSPhotoLibraryAddUsageDescription: "SLC-Lovers 需要保存权限来存储你们的珍贵瞬间。"
        NSCameraUsageDescription: "SLC-Lovers 需要相机权限来记录你们的日常。"
        NSMicrophoneUsageDescription: "SLC-Lovers 需要麦克风权限来发送语音消息。"
        NSUserNotificationsUsageDescription: "SLC-Lovers 需要通知权限来提醒你们重要的纪念日。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slclovers.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 兼容性设置：明确指定 Xcode 14 兼容的 objectVersion
        SWIFT_VERSION: "5.9"
        # 确保编译时不要求代码签名（CI 环境下）
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # iOS 17 部署目标
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
