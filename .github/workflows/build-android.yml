name: Build Android App

on:
  workflow_dispatch:
    inputs:
      notes:
        description: '构建说明（可选）'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'Android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设置 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. 显示环境
      - name: Print environment
        run: |
          java -version
          echo "Gradle: $(gradle --version 2>/dev/null | grep 'Gradle' | head -1 || echo 'not found')"

      # 5. 编译 Debug APK
      - name: Build Debug APK
        working-directory: Android
        run: |
          chmod +x ./gradlew || true
          # 如果没有 gradlew，用全局 gradle
          if [ ! -f "./gradlew" ]; then
            gradle assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # 6. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SLC-Lovers-Android-APK
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 7. 构建总结
      - name: Build summary
        run: |
          echo "## 🎉 Android 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**产物**：\`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**安装方法**：" >> $GITHUB_STEP_SUMMARY
          echo "1. 下载 APK 文件" >> $GITHUB_STEP_SUMMARY
          echo "2. 在 Android 手机上开启「允许未知来源应用」" >> $GITHUB_STEP_SUMMARY
          echo "3. 点击 APK 文件直接安装" >> $GITHUB_STEP_SUMMARY